[package]
name = "inpainter"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[dependencies]
assistant = { path = "../assistant" }
directories = "=6.0.0"
draw = { path = "../draw" }
eframe = "=0.36.2"
iconflow = { version = "=2.1.0", default-features = false, features = ["pack-iconoir"] }
kurbo = "=0.13.1"
libc = "=0.2.190"
octotablet = { version = "=0.1.0", default-features = false, features = ["wayland-tablet-unstable-v2"] }
protocol = { path = "../protocol" }
rfd = "=0.15.4"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.152"
trash = "=5.2.9"

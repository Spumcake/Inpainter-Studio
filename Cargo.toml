[workspace]
resolver = "3"
members = [
    "host",
    "protocol",
    "assistant",
    "draw",
    "client",
    "apps/template",
    "apps/simple-sketch",
    "apps/mission-control",
    "apps/image-editor",
]

# octotablet 0.1.0 binds tablet protocol versions it cannot parse, which
# closes the window's Wayland connection. See host/vendor/octotablet/PATCHED.md.
[patch.crates-io]
octotablet = { path = "host/vendor/octotablet" }

# Pictures are composited and painted pixel by pixel, which an unoptimised
# build does twenty times slower: everyday builds are optimised, and keep
# their debug checks.
[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 3

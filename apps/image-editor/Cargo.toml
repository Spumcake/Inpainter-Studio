[package]
name = "image-editor"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[dependencies]
protocol = { path = "../../protocol" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.152"
# PNG and JPEG in and out. Already in the lockfile through eframe.
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
